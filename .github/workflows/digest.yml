name: Daily digest

on:
  schedule:
    # Cron is in UTC. 05:30 UTC = 07:30 in UTC+2 (08:30 in summer time).
    # GitHub may start scheduled runs a few minutes late when it's busy.
    - cron: "30 5 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build the digest without emailing it (HTML is attached to the run as an artifact)"
        type: boolean
        default: false

permissions:
  contents: write # to commit sent_history.json back to the repo

concurrency:
  group: daily-digest
  cancel-in-progress: false

env:
  OLLAMA_MODEL: qwen2.5:3b
  OLLAMA_MODELS: /home/runner/ollama-models

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      # The model (~2 GB) is cached between runs so it isn't downloaded every day
      - name: Cache Ollama model
        uses: actions/cache@v6
        with:
          path: ${{ env.OLLAMA_MODELS }}
          key: ollama-${{ env.OLLAMA_MODEL }}-v1

      - name: Start Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          # The installer starts a system service with its own model dir; run our own server on the cached dir instead
          sudo systemctl stop ollama || true
          nohup ollama serve > "$RUNNER_TEMP/ollama.log" 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:11434/api/tags > /dev/null && break; sleep 1; done
          ollama pull "$OLLAMA_MODEL"

      - name: Build and send the digest
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST || 'smtp.gmail.com' }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || '587' }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python main.py --html digest.html
          else
            python main.py --send --html digest.html
          fi

      - name: Upload the HTML for preview
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: digest-html
          path: digest.html
          if-no-files-found: ignore
          retention-days: 7

      - name: Remember what was sent
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sent_history.json
          git diff --cached --quiet && exit 0
          git commit -m "Update sent history"
          git pull --rebase
          git push
